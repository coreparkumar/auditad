apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace "com.auditad.app.vercel"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.auditad.app.vercel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                
                def storePass = keystoreProperties['storePassword'] ?: keystoreProperties['MYAPP_RELEASE_STORE_PASSWORD']
                
                // Support both conventional keys (storeFile/storePassword/keyAlias/keyPassword)
                // and older MYAPP_* keys that some templates use.
                def storeFilePath = keystoreProperties['storeFile'] ?: keystoreProperties['MYAPP_RELEASE_STORE_FILE'] ?: keystoreProperties['MYAPP_RELEASE_STORE_FILE']
                if (storeFilePath != null && storeFilePath.toString().trim()) {
                    storeFile file(storeFilePath.toString())
                }
                if (storePass) {
                    storePassword storePass
                }
                def alias = keystoreProperties['keyAlias'] ?: keystoreProperties['MYAPP_RELEASE_KEY_ALIAS']
                if (alias) {
                    keyAlias alias
                }
                def keyPass = keystoreProperties['keyPassword'] ?: keystoreProperties['MYAPP_RELEASE_KEY_PASSWORD']
                if (keyPass) {
                    keyPassword keyPass
                }
            } else if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(project.property('MYAPP_RELEASE_STORE_FILE'))
                storePassword project.property('MYAPP_RELEASE_STORE_PASSWORD')
                keyAlias project.property('MYAPP_RELEASE_KEY_ALIAS')
                keyPassword project.property('MYAPP_RELEASE_KEY_PASSWORD')
            } else {
                println "WARNING: No keystore configuration found. Release builds will be unsigned."
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs?.release?.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Target only release build variants
            if (variant.buildType.name == "release") {
                // Fetch configuration details from your defaultConfig block
                def appName = "AdShield"
                def versionName = variant.versionName
                def versionCode = variant.versionCode
                
                // Set custom output file naming convention (.apk or .aab)
                outputFileName = "${appName}-v${versionName}-b${versionCode}.apk"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Jetpack Compose
    implementation "androidx.compose.ui:ui:$composeVersion"
    implementation "androidx.compose.ui:ui-graphics:$composeVersion"
    implementation "androidx.compose.ui:ui-tooling-preview:$composeVersion"
    implementation "androidx.compose.material3:material3:$composeMaterial3Version"
    implementation "androidx.compose.animation:animation:$composeVersion"
    implementation "androidx.compose.material:material-icons-extended:$composeVersion"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"

    // Room
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
